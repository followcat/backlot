name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      repeats:
        description: "Number of times to repeat the macOS test suite"
        required: false
        default: "3"
        type: string

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl
      # mlugg/setup-zig v1 fetches the obsolete zig-linux-x86_64-* name;
      # install the verified zig-x86_64-linux-* release directly.
      - uses: actions/cache@v4
        id: zig-cache
        with:
          path: ${{ runner.temp }}/hc-tui-zig-0.16.0
          key: zig-0.16.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/install-zig.sh') }}
      - name: Install Zig 0.16.0
        if: steps.zig-cache.outputs.cache-hit != 'true'
        run: tools/install-zig.sh "${{ runner.temp }}/hc-tui-zig-0.16.0"
      - name: Add Zig to PATH
        run: echo "${{ runner.temp }}/hc-tui-zig-0.16.0" >> "$GITHUB_PATH"
      - name: Check Zig version
        run: test "$(zig version)" = "0.16.0"
      - uses: ./.github/actions/zig-deps
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: sh scripts/check-test-tmp.sh
      - run: cargo test -p hc-tui --example parity_cells
      - run: python3 -m unittest discover -s scripts/parity -p 'test_*.py'
      - run: sh scripts/test-install.sh
      - run: sh tools/test-fetch-zig-deps.sh
      - name: Link static musl binary
        run: |
          cargo build --target x86_64-unknown-linux-musl -p hc-tui
          b=target/x86_64-unknown-linux-musl/debug/backlot
          file "$b" | grep -q "static"
          "$b" --version

  macos:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        id: zig-cache
        with:
          path: ${{ runner.temp }}/hc-tui-zig-0.16.0
          key: zig-0.16.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/install-zig.sh') }}
      - name: Install Zig 0.16.0
        if: steps.zig-cache.outputs.cache-hit != 'true'
        run: tools/install-zig.sh "${{ runner.temp }}/hc-tui-zig-0.16.0"
      - name: Add Zig to PATH
        run: echo "${{ runner.temp }}/hc-tui-zig-0.16.0" >> "$GITHUB_PATH"
      - name: Check Zig version
        run: test "$(zig version)" = "0.16.0"
      - uses: ./.github/actions/zig-deps
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-targets
      # --no-fail-fast: report every failing test binary in one run.
      - run: cargo test --no-fail-fast
      # shasum-based sha256 fallback on a host without sha256sum.
      - run: sh scripts/test-install.sh

  macos-repeat:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        id: zig-cache
        with:
          path: ${{ runner.temp }}/hc-tui-zig-0.16.0
          key: zig-0.16.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/install-zig.sh') }}
      - name: Install Zig 0.16.0
        if: steps.zig-cache.outputs.cache-hit != 'true'
        run: tools/install-zig.sh "${{ runner.temp }}/hc-tui-zig-0.16.0"
      - name: Add Zig to PATH
        run: echo "${{ runner.temp }}/hc-tui-zig-0.16.0" >> "$GITHUB_PATH"
      - name: Check Zig version
        run: test "$(zig version)" = "0.16.0"
      - uses: ./.github/actions/zig-deps
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-targets
      - name: Repeat macOS test suite
        run: |
          n="${{ inputs.repeats }}"
          case "$n" in
            ''|*[!0-9]*|0) echo "invalid repeats count: $n" >&2; exit 2 ;;
          esac
          i=1
          while [ "$i" -le "$n" ]; do
            echo "=== macOS repeat $i/$n ==="
            cargo test --no-fail-fast
            i=$((i + 1))
          done

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: target/test-core
          key: test-core-${{ hashFiles('tools/build-test-core.sh') }}
      - run: tools/build-test-core.sh
      # The test core ships its own zig; hc-vt builds fetch with it.
      - uses: ./.github/actions/zig-deps
        with:
          zig: ${{ github.workspace }}/target/test-core/zig/zig
      - run: >
          HC_TUI_TEST_CORE=$PWD/target/test-core/herdr-core
          cargo test -p hc-proto --test integration --
          --ignored --test-threads=1
      - run: >
          ZIG=$PWD/target/test-core/zig/zig
          HC_TUI_TEST_CORE=$PWD/target/test-core/herdr-core
          cargo test -p hc-tui --test real_core_smoke --
          --ignored --test-threads=1
      - run: >
          ZIG=$PWD/target/test-core/zig/zig
          HC_TUI_TEST_CORE=$PWD/target/test-core/herdr-core
          cargo test -p hc-tui --test real_stage --
          --ignored --test-threads=1
      - run: >
          ZIG=$PWD/target/test-core/zig/zig
          HC_TUI_TEST_CORE=$PWD/target/test-core/herdr-core
          cargo test -p hc-tui --test real_two_studios --
          --ignored --test-threads=1
      - run: >
          ZIG=$PWD/target/test-core/zig/zig
          HC_TUI_TEST_CORE=$PWD/target/test-core/herdr-core
          cargo test -p hc-tui --test real_hollywood --
          --ignored --test-threads=1
