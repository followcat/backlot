name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # mlugg/setup-zig v1 fetches the obsolete zig-linux-x86_64-* name;
      # install the verified zig-x86_64-linux-* release directly.
      - uses: actions/cache@v4
        id: zig-cache
        with:
          path: ${{ runner.temp }}/hc-tui-zig-0.16.0
          key: zig-0.16.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/install-zig.sh') }}
      - name: Install Zig 0.16.0
        if: steps.zig-cache.outputs.cache-hit != 'true'
        run: tools/install-zig.sh "${{ runner.temp }}/hc-tui-zig-0.16.0"
      - name: Add Zig to PATH
        run: echo "${{ runner.temp }}/hc-tui-zig-0.16.0" >> "$GITHUB_PATH"
      - name: Check Zig version
        run: test "$(zig version)" = "0.16.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo test -p hc-tui --example parity_cells
      - run: python3 -m unittest discover -s scripts/parity -p 'test_*.py'
      - run: sh scripts/test-install.sh

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        id: zig-cache
        with:
          path: ${{ runner.temp }}/hc-tui-zig-0.16.0
          key: zig-0.16.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/install-zig.sh') }}
      - name: Install Zig 0.16.0
        if: steps.zig-cache.outputs.cache-hit != 'true'
        run: tools/install-zig.sh "${{ runner.temp }}/hc-tui-zig-0.16.0"
      - name: Add Zig to PATH
        run: echo "${{ runner.temp }}/hc-tui-zig-0.16.0" >> "$GITHUB_PATH"
      - name: Check Zig version
        run: test "$(zig version)" = "0.16.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-targets
      # --no-fail-fast: report every failing test binary in one run.
      - run: cargo test --no-fail-fast
      # shasum-based sha256 fallback on a host without sha256sum.
      - run: sh scripts/test-install.sh

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: target/test-core
          key: test-core-${{ hashFiles('tools/build-test-core.sh') }}
      - run: tools/build-test-core.sh
      - run: >
          HC_TUI_TEST_CORE=$PWD/target/test-core/herdr-core
          cargo test -p hc-proto --test integration --
          --ignored --test-threads=1
      - run: >
          ZIG=$PWD/target/test-core/zig/zig
          HC_TUI_TEST_CORE=$PWD/target/test-core/herdr-core
          cargo test -p hc-tui --test real_core_smoke --
          --ignored --test-threads=1
