name: release

# pull_request lets the full matrix prove itself before the first tag;
# paths limits it to the files this workflow exercises.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - tools/**
      - scripts/install.sh
      - dist/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ztarget is the Zig -Dtarget name build.rs passes for a
          # cross build; the native leg stays empty.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, ztarget: x86_64-linux-musl }
          # Native arm runner: zig cc as linker fails on the erratum
          # flag CI's rustc adds (-Wl,--fix-cortex-a53-843419).
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, ztarget: aarch64-linux-musl }
          - { os: macos-latest, target: aarch64-apple-darwin, ztarget: "" }
          - { os: macos-latest, target: x86_64-apple-darwin, ztarget: x86_64-macos }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/cache@v4
        id: zig-cache
        with:
          path: ${{ runner.temp }}/hc-tui-zig-0.16.0
          key: zig-0.16.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/install-zig.sh') }}
      - name: Install Zig 0.16.0
        if: steps.zig-cache.outputs.cache-hit != 'true'
        run: tools/install-zig.sh "${{ runner.temp }}/hc-tui-zig-0.16.0"
      - name: Add Zig to PATH
        run: echo "${{ runner.temp }}/hc-tui-zig-0.16.0" >> "$GITHUB_PATH"
      - name: Check Zig version
        run: test "$(zig version)" = "0.16.0"
      - uses: ./.github/actions/zig-deps
        with:
          zig-target: ${{ matrix.ztarget }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target ${{ matrix.target }} -p hc-tui
      # Static proof for musl, a run where the runner executes the
      # build's own architecture. Cross targets get `file` only.
      - name: Check binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -eu
          b=target/$TARGET/release/backlot
          file "$b"
          case "$TARGET" in
            *-musl)
              file "$b" | grep -q "static"
              "$b" --version
              ;;
            aarch64-apple-darwin)
              "$b" --version
              ;;
          esac
      # The archive layout (binary + LICENSE + NOTICE + README.md, all
      # flat) is what scripts/install.sh and docs/install.md describe.
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -eu
          # GITHUB_REF_NAME is the tag on a tag push, "<n>/merge" on a
          # pull request — a fixed placeholder keeps the archive name sane.
          case "$GITHUB_REF_NAME" in
            v*) ver=${GITHUB_REF_NAME#v} ;;
            *) ver=0.0.0-pr ;;
          esac
          stage=backlot-$ver-$TARGET
          mkdir -p "$stage"
          cp "target/$TARGET/release/backlot" "$stage/backlot"
          cp LICENSE NOTICE dist/README.md "$stage/"
          tar -czf "backlot-$ver-$TARGET.tar.gz" -C "$stage" .
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: backlot-*.tar.gz
          if-no-files-found: error

  # A clean-machine install of what `build` packaged: a local mirror in
  # the layout scripts/install.sh fetches, the official-core step left
  # on, and a stub `claude` standing in for the agent so no real one
  # ever launches. Runs on every trigger this workflow has.
  install-check:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: macos-latest, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      HC_SESSION: backlot-install-check
      XDG_STATE_HOME: ${{ runner.temp }}/install-home/.local/state
      XDG_CONFIG_HOME: ${{ runner.temp }}/install-home/.config
      XDG_RUNTIME_DIR: ${{ runner.temp }}/install-home/.run
      TERM: xterm-256color
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist
      # install.sh fetches $BASE_URL/download/<tag>/<archive> and the
      # sibling sha256sums.txt — the mirror serves exactly that.
      - name: Serve a local release mirror
        run: |
          set -eu
          archive=$(basename dist/backlot-*-${{ matrix.target }}.tar.gz)
          ver=${archive#backlot-}
          ver=${ver%-${{ matrix.target }}.tar.gz}
          tag=v$ver
          mkdir -p "mirror/download/$tag"
          cp "dist/$archive" "mirror/download/$tag/"
          (
            cd "mirror/download/$tag"
            for f in backlot-*.tar.gz; do
              if command -v sha256sum >/dev/null 2>&1; then sha256sum "$f"
              elif command -v shasum >/dev/null 2>&1; then shasum -a 256 "$f"
              else openssl dgst -sha256 -r "$f"; fi
            done > sha256sums.txt
          )
          python3 -m http.server 8777 --bind 127.0.0.1 --directory mirror \
            > mirror.log 2>&1 &
          echo $! > mirror.pid
          for _ in $(seq 50); do
            curl -fsS "http://127.0.0.1:8777/download/$tag/sha256sums.txt" \
              -o /dev/null 2>&1 && break
            sleep 0.2
          done
          curl -fsS "http://127.0.0.1:8777/download/$tag/sha256sums.txt"
          echo "BACKLOT_TAG=$tag" >> "$GITHUB_ENV"
      - name: Install with scripts/install.sh
        env:
          HOME: ${{ runner.temp }}/install-home
          BACKLOT_BASE_URL: http://127.0.0.1:8777
          BACKLOT_VERSION: ${{ env.BACKLOT_TAG }}
        run: |
          set -eu
          mkdir -p "$HOME" "$XDG_STATE_HOME" "$XDG_CONFIG_HOME" "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          sh scripts/install.sh
      - name: Check the installed binaries
        id: check
        env:
          HOME: ${{ runner.temp }}/install-home
        run: |
          set -eu
          bin="$HOME/.local/bin"
          "$bin/backlot" --version
          # The official installer may have no build for this platform —
          # report it and skip the studio step rather than pretend.
          if "$bin/hc" --version 2>/dev/null || hc --version 2>/dev/null; then
            echo "hc=ok" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::official hc has no usable build for ${{ matrix.os }} — skipping the studio check"
            echo "hc=missing" >> "$GITHUB_OUTPUT"
          fi
      # Follows the guide end to end: a one-commit repo, a claude cast,
      # `studio new`, `stage start` — with a stub `claude` that answers
      # --version and otherwise stays alive reading input.
      - name: Run a studio on a stub claude
        if: steps.check.outputs.hc == 'ok'
        env:
          HOME: ${{ runner.temp }}/install-home
        run: |
          set -u
          bin="$HOME/.local/bin"
          hc="$bin/hc"; [ -x "$hc" ] || hc=$(command -v hc)
          stub="$HOME/stub-bin"
          mkdir -p "$stub"
          cat > "$stub/claude" <<'STUB'
          #!/bin/sh
          if [ "$1" = "--version" ]; then echo "claude-stub 0.0.0"; exit 0; fi
          while IFS= read -r _line; do :; done
          STUB
          chmod +x "$stub/claude"
          export PATH="$bin:$stub:$PATH"

          repo="$HOME/acme-shop"
          mkdir -p "$repo"
          git -C "$repo" init -q
          GIT_AUTHOR_NAME=ci GIT_AUTHOR_EMAIL=ci@example.invalid \
          GIT_COMMITTER_NAME=ci GIT_COMMITTER_EMAIL=ci@example.invalid \
            git -C "$repo" commit -q --allow-empty -m init

          cat > "$HOME/cast.toml" <<'CAST'
          [producer]
          runner = "claude"
          model = "claude-haiku-5-5"
          effort = "low"
          permission_profile = "standard"

          [director]
          runner = "claude"
          model = "claude-haiku-5-5"
          effort = "low"
          permission_profile = "standard"

          [writer]
          runner = "claude"
          model = "claude-haiku-5-5"
          effort = "low"
          permission_profile = "standard"
          CAST

          "$hc" server start
          "$bin/backlot" studio new --studio acme-shop --title "Shop" \
            --repo "$repo" --cast "$HOME/cast.toml"
          "$bin/backlot" stage start

          ok=0
          end=$(( $(date +%s) + 240 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            ls_out=$("$hc" ls 2>/dev/null || true)
            status_out=$("$bin/backlot" status --studio acme-shop 2>/dev/null || true)
            if echo "$ls_out" | grep -q bl-acme-shop-producer \
               && echo "$ls_out" | grep -q bl-acme-shop-director \
               && echo "$status_out" | grep -q 'producer.*(live)' \
               && echo "$status_out" | grep -q 'director.*(live)'; then
              ok=1
              break
            fi
            sleep 2
          done
          echo "$ls_out"
          echo "$status_out"
          [ "$ok" = 1 ]
      - name: Print the stage screen and status
        if: always() && steps.check.outputs.hc == 'ok'
        env:
          HOME: ${{ runner.temp }}/install-home
        run: |
          set -u
          bin="$HOME/.local/bin"
          hc="$bin/hc"; [ -x "$hc" ] || hc=$(command -v hc || true)
          "$bin/backlot" status --studio acme-shop || true
          "$hc" ls || true
          "$hc" read backlot-stage || true
          "$hc" read bl-acme-shop-producer || true
          "$hc" read bl-acme-shop-director || true
      - name: Stop the core
        if: always() && steps.check.outputs.hc == 'ok'
        env:
          HOME: ${{ runner.temp }}/install-home
        run: |
          hc="$HOME/.local/bin/hc"; [ -x "$hc" ] || hc=$(command -v hc || true)
          "$hc" server stop || true
      - name: Stop the mirror
        if: always()
        run: if [ -f mirror.pid ]; then kill "$(cat mirror.pid)" || true; fi

  release:
    needs: [build, install-check]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # The tag's own installer ships as an asset so the documented
      # `curl …/latest/download/install.sh | sh` always matches it.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - run: cp scripts/install.sh dist/install.sh
      - name: Checksums
        run: |
          cd dist
          sha256sum *.tar.gz > sha256sums.txt
          cat sha256sums.txt
      - name: Draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "$GITHUB_REF_NAME" --draft
          --title "backlot $GITHUB_REF_NAME"
          --notes "Install: sh scripts/install.sh, or fetch an archive
          and verify it against sha256sums.txt. See
          https://github.com/followcat/backlot#install"
          dist/*.tar.gz dist/install.sh dist/sha256sums.txt
