[workspace]
resolver = "3"
members = ["crates/hc-proto", "crates/hc-tui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
hc-proto = { path = "crates/hc-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util"] }
