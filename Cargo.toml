[workspace]
resolver = "3"
members = [
    "crates/backlot-model",
    "crates/backlot-stage",
    "crates/hc-proto",
    "crates/hc-tui",
    "crates/hc-vt",
]

[workspace.package]
version = "0.4.24"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
backlot-model = { path = "crates/backlot-model" }
backlot-stage = { path = "crates/backlot-stage" }
hc-proto = { path = "crates/hc-proto" }
hc-vt = { path = "crates/hc-vt" }
libc = "0.2"
crossterm = "0.29"
ratatui = { version = "0.30.2", default-features = false, features = ["std", "macros", "crossterm"] }
serde = { version = "1", features = ["derive"] }
unicode-width = "0.2.2"
serde_json = "1"
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
