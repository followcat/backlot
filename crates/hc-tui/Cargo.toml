[package]
name = "hc-tui"
description = "Terminal UI client for herdr-core (hc)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
hc-proto.workspace = true
hc-vt.workspace = true
crossterm = { version = "0.29", features = ["event-stream"] }
ratatui = { version = "0.30.2", default-features = false, features = ["std", "macros", "crossterm"] }
serde.workspace = true
serde_json.workspace = true
# Match the pinned herdr configuration parser and its diagnostics.
toml = "=0.8.23"
tokio = { workspace = true, features = ["rt", "sync", "time"] }
unicode-segmentation = "1.12.0"
unicode-width = "0.2.2"
futures-lite = "2"
serde_ignored = "0.1.14"
signal-hook = "0.3"
# Same formatter as the pinned reference tab-bar config.
time = { version = "=0.3.47", features = ["formatting"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "test-util"] }
